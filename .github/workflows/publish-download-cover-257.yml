name: Publish verified download covers 2.0.2.5.7

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-download-covers-2.0.2.5.7
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: kelaner/Ehviewer_CN_SXJ
      EXPECTED_SHA: 6ceb1a1b59757c6439033796a75c7d5ddcc5b190
      BUILD_RUN: '39554124961'
      RELEASE_ID: '419218278'
    steps:
      - name: Verify tested source and exact draft
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root / 'run.json').read_text())
          release = json.loads((root / 'release.json').read_text())
          assert run['head_sha'] == os.environ['EXPECTED_SHA']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/build.yml'
          assert run['repository']['full_name'] == os.environ['GH_REPO']
          assert release['tag_name'] == 'v2.0.2.5.7'
          assert release['target_commitish'] == os.environ['EXPECTED_SHA']
          PY

      - uses: actions/checkout@v4
        with:
          ref: 6ceb1a1b59757c6439033796a75c7d5ddcc5b190

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'

      - name: Download and verify signed universal APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk" "$RUNNER_TEMP/publish"
          gh run download "$BUILD_RUN" -n Ehviewer-Release -D "$RUNNER_TEMP/apk"
          mapfile -t APKS < <(find "$RUNNER_TEMP/apk" -name '*.apk' -type f)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/publish/APK-SIGNATURE.txt"
          cat "$RUNNER_TEMP/publish/APK-SIGNATURE.txt"
          grep -F 'certificate SHA-256 digest: 8f75d13aef754b495a32d2c2951dd0cb927058409dcc0173145da019c4fd0255' "$RUNNER_TEMP/publish/APK-SIGNATURE.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -E "^package: name='com.kelaner.ehviewer' versionCode='118' versionName='2.0.2.5.7'" "$RUNNER_TEMP/badging.txt"
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -Z1 "$APK" | grep "^lib/$ABI/libehviewer.so$" > /dev/null
          done
          cp "$APK" "$RUNNER_TEMP/publish/Ehviewer-2.0.2.5.7.apk"
          cp docs/download-cover-investigation-2.0.2.5.7.md "$RUNNER_TEMP/publish/"
          cd "$RUNNER_TEMP/publish"
          sha256sum Ehviewer-2.0.2.5.7.apk > SHA256.txt

      - name: Upload verified assets and publish
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v2.0.2.5.7 "$RUNNER_TEMP/publish/"* --clobber
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/assets.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'assets.json').read_text())
          names = {a['name'] for a in release['assets'] if a['state'] == 'uploaded' and a['size'] > 0}
          assert {'Ehviewer-2.0.2.5.7.apk', 'SHA256.txt', 'APK-SIGNATURE.txt', 'download-cover-investigation-2.0.2.5.7.md'} <= names
          PY
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true
